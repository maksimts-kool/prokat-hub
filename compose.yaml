name: prokat-hub

services:
  db:
    # MariaDB, like the Zone server the app is deployed to.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: ProkatHub.Api/Dockerfile
      target: ${API_BUILD_TARGET:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Server=db;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD}
      Database__ServerVersion: ${DB_SERVER_VERSION:-10.11}
      # Apply migrations and seed the demo catalogue on start in every environment, so a fresh
      # database works without a manual step. Both are idempotent.
      Database__MigrateOnStartup: ${DB_MIGRATE_ON_STARTUP:-true}
      Seed__DemoData: ${SEED_DEMO_DATA:-true}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: ${CLIENT_ORIGIN:-http://localhost:5173}
      Seed__Accounts__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
      Seed__Accounts__Staff__Password: ${SEED_STAFF_PASSWORD:-}
      Seed__Accounts__Customer__Password: ${SEED_CUSTOMER_PASSWORD:-}
      Seed__Accounts__Service__Password: ${SEED_SERVICE_PASSWORD:?Set SEED_SERVICE_PASSWORD in .env}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # GET /health checks the database too. Plain bash, because the runtime image has no curl.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      # dotnet watch compiles before it listens; migrations run on the first start.
      start_period: 3m
      start_interval: 5s
    develop:
      watch:
        # Source changes are copied into the container and picked up by `dotnet watch`.
        - action: sync
          path: ./server/ProkatHub.Api
          target: /src/ProkatHub.Api
          ignore:
            - bin/
            - obj/
            - ProkatHub.Api.csproj
        # New packages need a fresh restore, so rebuild the image.
        - action: rebuild
          path: ./server/ProkatHub.Api/ProkatHub.Api.csproj

  worker:
    build:
      context: ./server
      dockerfile: ProkatHub.Worker/Dockerfile
    restart: unless-stopped
    depends_on:
      # Starts once the API answers, so the first overdue run can log in straight away.
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Api__BaseUrl: http://api:8080
      Api__Email: ${SERVICE_EMAIL:-service@prokathub.test}
      Api__Password: ${SEED_SERVICE_PASSWORD:?Set SEED_SERVICE_PASSWORD in .env}
      Overdue__Interval: ${WORKER_INTERVAL:-01:00:00}
    develop:
      watch:
        # The worker has no hot reload; any source change rebuilds its image.
        - action: rebuild
          path: ./server/ProkatHub.Worker
          ignore:
            - bin/
            - obj/

  web:
    build:
      context: ./client
      # dev = Vite dev server (use `docker compose watch`), final = the built client on nginx
      target: ${WEB_BUILD_TARGET:-dev}
      args:
        # The final image bakes the API address into the bundle at build time.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The browser calls the API directly, so this is the API address as seen from the host.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    develop:
      watch:
        # Source changes are copied into the container and picked up by Vite's hot reload.
        - action: sync
          path: ./client
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
            - pnpm-lock.yaml
        # New packages need a fresh install, so rebuild the image.
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/pnpm-lock.yaml

volumes:
  # A new name, so the old PostgreSQL data volume isn't mounted into MariaDB.
  db-data:
    name: prokat-hub-mariadb-data
