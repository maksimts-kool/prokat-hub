# Serves the built single-page app. Every path that isn't a file falls back to index.html,
# so deep links such as /catalogue/12 load the app and React Router takes over.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must always be fresh, or a new deploy keeps loading old asset names.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
